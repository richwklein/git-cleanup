name: Release
# No paths filter: release-please must see every push to main so it can
# parse conventional commits and drive version bumps. Filtering by path
# would silently skip commits and break the release train.
on:
  push:
    branches: [main]
  # Manual trigger for rebuilding a release PR without a new commit on main —
  # e.g. after correcting tag state, when release-please computed the wrong
  # commit range and the stale PR was closed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
